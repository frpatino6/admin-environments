<div class="relative overflow-hidden rounded-2xl border border-white/15 bg-[#0f0f2a]/95 px-10 py-8 shadow-glass-lg backdrop-blur-[16px]">
  <!-- Top glow line -->
  <div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-red-500/40 to-transparent"></div>

  <!-- Header -->
  <div class="mb-6 flex items-center gap-3">
    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-red-500/15 ring-1 ring-red-500/25">
      <svg class="h-5 w-5 text-red-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18 18 6 6m12 0L6 18" />
      </svg>
    </div>
    <div>
      <h2 class="text-base font-bold text-white">Rechazar QA de {{ data.jiraKey }}</h2>
      <p class="text-xs text-slate-500">Indica el motivo — es obligatorio para reasignar a otro revisor</p>
    </div>
  </div>

  <!-- Input -->
  <div>
    <label class="mb-1.5 block text-xs font-medium text-slate-400">Motivo del rechazo</label>
    <textarea
      [ngModel]="reason()"
      (ngModelChange)="reason.set($event)"
      rows="4"
      placeholder="Ej: estoy fuera de la oficina esta semana"
      class="w-full resize-none rounded-xl border border-white/10 bg-white/5 py-2.5 px-4 text-sm text-white placeholder-slate-500 outline-none transition-all duration-200 focus:border-red-500/40 focus:bg-white/[0.07] focus:ring-1 focus:ring-red-500/25"></textarea>
  </div>

  <!-- Actions -->
  <div class="mt-8 flex gap-3">
    <button
      (click)="onCancel()"
      class="flex flex-1 items-center justify-center rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm font-medium text-slate-400 transition-all duration-200 hover:bg-white/10 hover:text-slate-200">
      Cancelar
    </button>
    <button
      (click)="onConfirm()"
      [disabled]="!isValid()"
      class="flex flex-1 items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-red-500 to-red-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg transition-all duration-200 hover:scale-[1.02] hover:shadow-red-500/25 disabled:cursor-not-allowed disabled:opacity-40 active:scale-[0.98]">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18 18 6 6m12 0L6 18" />
      </svg>
      Rechazar
    </button>
  </div>
</div>
